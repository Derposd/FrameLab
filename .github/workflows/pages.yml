name: site

# Publishes the static landing page in site/ to GitHub Pages
# (Settings → Pages → Source: GitHub Actions).
# Runs on every push to main, so a new APP_VERSION in build.yml shows up on the site right away.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the current version into the page
        run: python3 .github/scripts/stamp-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      # The artifact list can lag behind a successful upload. A unique name also
      # prevents retries from finding both the old and the newly uploaded archive.
      - name: Wait for the uploaded artifact to appear
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -Fxq "$PAGES_ARTIFACT"; then
              exit 0
            fi
            sleep 5
          done
          echo "The uploaded Pages artifact did not become visible in time."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
