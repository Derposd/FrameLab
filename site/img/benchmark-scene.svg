  <text x="72" y="178" font-family="Segoe UI,Arial" font-size="42" font-weight="700" fill="#26241F">Бенчмарк до/после</text>
  <text x="72" y="216" font-family="Segoe UI,Arial" font-size="17" fill="#514D44">Сравните одинаковую 3D-сцену без запуска игры</text>
  <text x="1125" y="216" font-family="Consolas,monospace" font-size="10" letter-spacing="1" fill="#716B60">ПРИМЕР ДАННЫХ</text>
  <rect x="72" y="252" width="1296" height="372" fill="#e0dacf" stroke="#918878" stroke-width="1"/>
  <text x="104" y="294" font-family="Consolas,monospace" font-size="11" letter-spacing="2" fill="#716B60">СИНТЕТИЧЕСКАЯ СЦЕНА · FRAME LAB</text>
  <text x="104" y="338" font-family="Segoe UI,Arial" font-size="28" font-weight="650" fill="#26241F">Проверка без игры</text>
  <text x="104" y="371" font-family="Segoe UI,Arial" font-size="15" fill="#514D44">Фиксированная сцена с освещением и движущимися объектами.</text>
  <text x="104" y="396" font-family="Segoe UI,Arial" font-size="15" fill="#514D44">Результат помогает сравнить настройки на одном ПК.</text>
  <rect x="104" y="430" width="240" height="54" fill="#A74738"/>
  <text x="224" y="464" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#F5F0E6">Запустить тест · 30 с</text>
  <text x="104" y="523" font-family="Segoe UI,Arial" font-size="13" fill="#716B60">Результат тестовой сцены не равен FPS в конкретной игре.</text>
