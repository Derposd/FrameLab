<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">FrameLab — синтетический бенчмарк</title>
  <desc id="desc">Иллюстрация экрана теста встроенной 3D-сцены; цифры показаны только как пример.</desc>
  <defs>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#272b38"/><stop offset="1" stop-color="#11131a"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#ff7858"/><stop offset="1" stop-color="#e8380d"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#1d202a"/><stop offset="1" stop-color="#14161d"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#d8d2c6"/>
